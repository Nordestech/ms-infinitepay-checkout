spring:
  application:
    name: ms-infinitepay-checkout
  profiles:
    active: dev

---
# Configuração de Desenvolvimento
spring:
  config:
    activate:
      on-profile: dev
  data:
    mongodb:
      uri: ${MONGODB_ATLAS_URI}
  rabbitmq:
    host: ${RABBITMQ_HOST}
    port: ${RABBITMQ_PORT}
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}
logging:
  level:
    org.springframework.data.mongodb.core.MongoTemplate: DEBUG